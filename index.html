<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مركز ليزر كير كلينك</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
:root{--bg:#f7f5f8;--card:#fff;--text:#29252d;--muted:#827b86;--primary:#9a668c;--primary2:#c692b2;--accent:#d9b37c;--line:#eee7ee;--danger:#c65d68;--success:#4f9a78;--warning:#c98c3e;--shadow:0 14px 40px rgba(71,48,67,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}
.sidebar{width:275px;background:linear-gradient(180deg,#3f303d,#594052 48%,#3d303b);color:#fff;padding:24px 16px;position:fixed;right:0;top:0;bottom:0;z-index:20;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:8px 8px 24px;border-bottom:1px solid rgba(255,255,255,.13);margin-bottom:16px}
.logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#e4c08f,#b97da2);display:grid;place-items:center;font-size:25px;box-shadow:0 8px 25px #17101755}
.brand h1{font-size:17px;margin:0}.brand small{opacity:.7}
.nav button{width:100%;background:transparent;color:#eee;text-align:right;padding:12px 13px;margin:3px 0;border-radius:13px;display:flex;align-items:center;gap:11px;font-weight:600;transition:.2s}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.12);color:#fff}.nav .ico{width:27px;text-align:center;font-size:18px}
.main{margin-right:275px;width:calc(100% - 275px);padding:24px 28px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:15px}.welcome h2{margin:0 0 3px;font-size:25px}.welcome p{margin:0;color:var(--muted);font-size:13px}
.top-actions{display:flex;gap:8px}.btn{padding:10px 15px;border-radius:11px;background:#fff;color:var(--text);box-shadow:0 5px 18px #4b33400b;border:1px solid var(--line);font-weight:700}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.gold{background:#ead2ad;color:#5d4530}.btn.danger{background:#fff1f2;color:#a33d49}
.page{display:none}.page.active{display:block}.hero{min-height:235px;border-radius:24px;padding:28px;color:#fff;display:flex;align-items:flex-end;background:linear-gradient(90deg,rgba(51,36,48,.82),rgba(112,67,98,.42)),url('https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?auto=format&fit=crop&w=1600&q=85') center/cover;box-shadow:var(--shadow);margin-bottom:20px}.hero h3{font-size:27px;margin:0 0 4px}.hero p{margin:0;opacity:.88}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.metric{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);position:relative;overflow:hidden}.metric:after{content:"";position:absolute;left:-25px;bottom:-35px;width:100px;height:100px;border-radius:50%;background:#b77e9d12}.metric .mi{font-size:22px}.metric b{display:block;font-size:25px;margin:7px 0 0}.metric span{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;margin-top:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.panel h3{margin:0 0 15px;font-size:17px}.alerts{display:grid;gap:10px}.alert{padding:11px 13px;border-radius:12px;background:#faf7fa;border-right:4px solid var(--primary);font-size:13px}.alert.red{border-right-color:var(--danger)}.alert.orange{border-right-color:var(--warning)}
.page-title{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px}.page-title h2{margin:0;font-size:24px}.page-title p{margin:4px 0 0;color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.search{flex:1;min-width:220px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none}.search:focus,input:focus,select:focus,textarea:focus{border-color:#bf91b0;box-shadow:0 0 0 3px #bf91b015}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:auto;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:12px 13px;border-bottom:1px solid #f0ebf0;text-align:right;font-size:12.5px;white-space:nowrap}th{background:#faf7fa;color:#665b66;font-weight:800}tr:hover td{background:#fdfbfc}.tag{display:inline-flex;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700}.green{background:#e8f5ef;color:#39765a}.red{background:#fdebed;color:#a84350}.orange{background:#fff3df;color:#956524}.blue{background:#e9f0fb;color:#456b9d}.purple{background:#f1e9f4;color:#76547b}
.cards.menu{grid-template-columns:repeat(4,1fr);margin-top:18px}.menu-card{background:#fff;border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.2s}.menu-card:hover{transform:translateY(-3px)}.menu-img{height:120px;background-size:cover;background-position:center}.menu-body{padding:13px}.menu-body b{font-size:14px}.menu-body p{font-size:11px;color:var(--muted);margin:5px 0 0}
.modal{position:fixed;inset:0;background:#251b2466;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}.modal-box{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:22px;box-shadow:0 30px 80px #24152455}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h3{margin:0}.close{background:#f6f1f5;width:36px;height:36px;border-radius:50%;font-size:20px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);padding:10px;border-radius:10px;outline:none;background:#fff}.field textarea{min-height:85px;resize:vertical}.full{grid-column:1/-1}.modal-foot{display:flex;justify-content:flex-start;gap:8px;margin-top:17px}
.scroll-nav{position:fixed;left:16px;bottom:22px;display:flex;flex-direction:column;gap:10px;z-index:40}
.scroll-btn{width:46px;height:46px;border-radius:50%;border:3px solid #000;background:#ead2ad;color:#111;font-size:19px;font-weight:900;box-shadow:4px 4px 0 #000;display:grid;place-items:center;transition:.15s}
.scroll-btn:hover{transform:translateY(-2px)}
.scroll-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
@media(max-width:560px){.scroll-nav{left:10px;bottom:14px;gap:7px}.scroll-btn{width:38px;height:38px;font-size:16px}}
.empty{padding:35px;text-align:center;color:var(--muted)}.mini{font-size:11px;color:var(--muted)}
.login-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(63,48,61,.92),rgba(154,102,140,.88)),url('https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?auto=format&fit=crop&w=1600&q=85') center/cover;padding:18px}
.login-card{width:min(430px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 30px 80px #24152455;text-align:center}
.login-card .logo{margin:0 auto 14px;width:64px;height:64px;font-size:30px}
.login-card h2{margin:0 0 4px;font-size:22px}.login-card p{margin:0 0 20px;color:var(--muted);font-size:13px}
.login-card .field{text-align:right;margin-bottom:13px}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.cards.menu{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:780px){.sidebar{width:78px;padding:16px 8px}.brand div:not(.logo),.nav span:not(.ico){display:none}.brand{justify-content:center}.nav button{justify-content:center}.main{margin-right:78px;width:calc(100% - 78px);padding:15px}.topbar{align-items:flex-start}.top-actions .btn:not(.primary){display:none}.cards{grid-template-columns:1fr 1fr}.hero{min-height:190px}.form-grid{grid-template-columns:1fr}}
@media(max-width:520px){.cards,.cards.menu{grid-template-columns:1fr}.main{padding:11px}.welcome h2{font-size:20px}}
</style>

body{background:linear-gradient(rgba(247,245,248,.86),rgba(247,245,248,.86)),var(--bg-app) center/cover fixed}
.login-screen{background:linear-gradient(135deg,rgba(40,25,45,.28),rgba(154,102,140,.22)),var(--bg-login) center/cover}
.nav button{background:var(--c);color:#111;border:2px solid #000;box-shadow:3px 3px 0 #000;margin:7px 0;font-weight:800}
.nav button:hover,.nav button.active{background:var(--c);color:#111;filter:brightness(1.08)}
.nav button.active{box-shadow:0 0 0 3px #fff,5px 5px 0 3px #000}
.nav .ico{width:34px;height:34px;display:grid;place-items:center;background:#fff;border:2px solid #000;border-radius:10px;font-size:18px}
.panel,.table-wrap,.metric,.modal-box{border:2px solid #000}
.btn,.close,.tag{border:2px solid #000}
.btn.primary,.btn.gold,.btn.danger{border-color:#000}
.tag{border-width:1.5px}
.field input,.field select,.field textarea,.search{border:1.5px solid #000}
th,td{border:1px solid #000}
th{background:var(--pc,#ead2ad);color:#111}
.page-title{border-bottom:4px solid var(--pc,#9a668c);padding-bottom:10px}

/* ===== الشاشة الرئيسية: أيقونات ملونة بإطار أسود ===== */
.app{display:flex;justify-content:center}
.main{margin:0 auto;width:100%;max-width:1500px;padding:22px 26px}
.topbar{background:#fff;border:3px solid #000;border-radius:22px;box-shadow:5px 5px 0 #000;padding:12px 16px;margin-bottom:28px;flex-wrap:wrap}
.tb-start{display:flex;align-items:center;gap:12px;min-width:0}
.tb-logo{width:50px;height:50px;flex:none;border-radius:15px;border:3px solid #000;box-shadow:2px 2px 0 #000;display:grid;place-items:center;font-size:25px;background:var(--pc,linear-gradient(135deg,#f3d3a4,#c692b2))}
.tb-title{min-width:0}.tb-title h1{margin:0;font-size:21px;font-weight:800;line-height:1.3}.tb-title small{color:var(--muted);font-size:12px;font-weight:600}
.back-btn{background:var(--pc,#ead2ad);color:#111;border:3px solid #000;border-radius:14px;box-shadow:3px 3px 0 #000;padding:10px 16px;font-weight:800;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.back-btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 #000}.back-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 #000}
.top-actions .btn{display:inline-flex!important;align-items:center}
.mode-home #view,.mode-home .back-btn{display:none}
.mode-page #home{display:none}
.mode-page #view{animation:pgIn .28s ease both}
@keyframes pgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.home-hero{text-align:center;margin:0 0 26px}
.home-hero h2{margin:0 0 4px;font-size:30px;font-weight:800}.home-hero p{margin:0;color:var(--muted);font-size:14px;font-weight:600}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;padding:4px 6px 30px}.tiles>.tile{flex:0 1 calc((100% - 110px)/6);min-width:190px}
.tile{background:var(--c);color:#111;border:3px solid #000;border-radius:26px;box-shadow:7px 7px 0 #000;min-height:200px;padding:24px 14px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;font-weight:800;font-size:16.5px;line-height:1.55;transition:transform .16s,box-shadow .16s;animation:tileIn .5s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i)*55ms);-webkit-tap-highlight-color:transparent}
.tile .t-ico{width:88px;height:88px;border-radius:26px;background:#fff;border:3px solid #000;box-shadow:4px 4px 0 #000;display:grid;place-items:center;font-size:46px;transition:transform .2s}
.tile:hover{transform:translate(-4px,-4px);box-shadow:11px 11px 0 #000}
.tile:hover .t-ico{transform:rotate(-6deg) scale(1.06)}
.tile:active{transform:translate(4px,4px);box-shadow:2px 2px 0 #000}
.tile:focus-visible{outline:4px solid #fff;outline-offset:0;box-shadow:0 0 0 8px #000,7px 7px 0 8px #000}
@keyframes tileIn{from{opacity:0;transform:translateY(22px) scale(.92)}to{opacity:1;transform:none}}
.tiles.few>.tile{flex:0 1 275px}
.tile.active-tab{outline:4px solid #000;transform:translate(-4px,-4px);box-shadow:11px 11px 0 #000}
.tile.active-tab .t-ico{transform:rotate(-6deg) scale(1.06)}
@media(prefers-reduced-motion:reduce){.tile,.mode-page #view{animation:none}.tile,.tile .t-ico{transition:none}}
@media(max-width:780px){.main{padding:14px}.topbar{padding:10px 12px;margin-bottom:20px}.tb-title h1{font-size:17px}.tb-logo{width:42px;height:42px;font-size:21px}#topUser{font-size:10.5px;padding:6px 8px!important}}
@media(max-width:560px){.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:2px 2px 24px}.tiles>.tile{min-width:0}.tiles>.tile:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 7px)}.tile{min-height:160px;padding:16px 8px 14px;font-size:13.5px;gap:12px;border-radius:20px;box-shadow:5px 5px 0 #000}.tile .t-ico{width:64px;height:64px;font-size:33px;border-radius:19px}.home-hero h2{font-size:23px}}
</style>
</head>
<body>

<!-- صفحة الدخول -->
<div class="login-screen" id="loginScreen">
  <form class="login-card" onsubmit="doLogin();return false">
    <div class="logo">✦</div>
    <h2 style="margin-bottom:20px">مركز ليزر كير كلينك</h2>
    <div class="field"><label>اسم المستخدم</label><select id="loginUser" onchange="loginTypeShow()"></select></div>
    <div class="field"><label>النوع</label><input id="loginType" readonly tabindex="-1" placeholder="يظهر تلقائيًا"></div>
    <div class="field"><label>كلمة المرور</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <div id="loginErr" class="mini" style="display:none;color:var(--danger);margin-bottom:12px;font-weight:700">بيانات الدخول غير صحيحة</div>
    <button class="btn primary" style="width:100%;padding:12px">دخول</button>
  </form>
</div>

<div class="app mode-home" id="app" style="display:none">
<main class="main">
  <div class="topbar">
    <div class="tb-start">
      <button class="back-btn" id="backBtn" onclick="backHome()">➜ الرئيسية</button>
      <div class="tb-logo" id="pageIco">✦</div>

/* ملفات "معلومة طبية تفيدك" في IndexedDB */
const idb=new Promise((res,rej)=>{try{const q=indexedDB.open('lck_files',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});idb.catch(()=>{});
function idbTx(mode,fn){return idb.then(db=>new Promise((res,rej)=>{const t=db.transaction('f',mode);const rq=fn(t.objectStore('f'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}))}
const fPutL=(k,b)=>idbTx('readwrite',s=>s.put(b,k));
const fPut=(k,b)=>fPutL(k,b).then(r=>{try{window.FBF&&window.FBF.put(k,b)}catch(e){}return r});
const fGet=k=>idbTx('readonly',s=>s.get(k)).then(b=>b||(window.FBF?window.FBF.get(k,fPutL):b));
const fDel=k=>idbTx('readwrite',s=>s.delete(k)).then(r=>{try{window.FBF&&window.FBF.del(k)}catch(e){}return r});

/* ===== كلمات المرور: SHA-256 مع Salt و2000 تكرار ===== */
const SHA_K=(()=>{const k=[];for(let n=2;k.length<64;n++){let p=true;for(let d=2;d*d<=n;d++)if(n%d===0){p=false;break}if(p)k.push(Math.floor((Math.cbrt(n)%1)*4294967296)>>>0)}return k})();
const SHA_H=(()=>{const h=[];for(let n=2;h.length<8;n++){let p=true;for(let d=2;d*d<=n;d++)if(n%d===0){p=false;break}if(p)h.push(Math.floor((Math.sqrt(n)%1)*4294967296)>>>0)}return h})();
function sha256hex(str){
 let H=SHA_H.slice();const m=new TextEncoder().encode(str),l=m.length,nb=((l+8)>>6)+1,w=new Uint32Array(nb*16);
 for(let i=0;i<l;i++)w[i>>2]|=m[i]<<(24-(i&3)*8);
 w[l>>2]|=0x80<<(24-(l&3)*8);w[nb*16-1]=l*8;
 const W=new Uint32Array(64);
 for(let bl=0;bl<nb;bl++){
  for(let t=0;t<16;t++)W[t]=w[bl*16+t];
  for(let t=16;t<64;t++){const x=W[t-15],y=W[t-2];const s0=((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3);const s1=((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10);W[t]=(W[t-16]+s0+W[t-7]+s1)|0}
  let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
  for(let t=0;t<64;t++){
   const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)),ch=(e&f)^(~e&g),t1=(h+S1+ch+SHA_K[t]+W[t])|0;
   const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)|0;
   h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
  }
  H=[H[0]+a|0,H[1]+b|0,H[2]+c|0,H[3]+d|0,H[4]+e|0,H[5]+f|0,H[6]+g|0,H[7]+h|0];
 }
 return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
function rnd16(){const a=new Uint8Array(8);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<8;i++)a[i]=Math.floor(Math.random()*256)}return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')}

function stockCalc(sup,iss){
 sup=sup||state.supplies;iss=iss||state.issues;
 const M=new Map();
 const get=n=>{const k=sp(n);if(!k)return null;if(!M.has(k))M.set(k,{item:k,code:'',unit:'',in:0,out:0,vin:0,pub:'',firstIn:'',lastIn:'',lastIssue:'',lots:[]});return M.get(k)};
 sup.map((r,i)=>[r,i]).sort((a,b)=>String(a[0].date||'').localeCompare(String(b[0].date||''))||a[1]-b[1]).forEach(([r])=>{
  const m=get(r.item);if(!m)return;
  const q=Number(r.qty||0),d=String(r.date||'');
  if(r.code)m.code=sp(r.code);
  if(r.unit)m.unit=r.unit;
  m.in+=q;m.vin+=q*Number(r.cost||0);
  if(r.pubPrice!==undefined&&r.pubPrice!=='')m.pub=r.pubPrice;
  if(d&&(!m.firstIn||d<m.firstIn))m.firstIn=d;
  if(d&&d>m.lastIn)m.lastIn=d;
  if(q>0)m.lots.push({exp:r.expiry||'',qty:q,date:d});
 });
 iss.forEach(r=>{
  const m=get(r.item);if(!m)return;
  const d=String(r.date||'');
  m.out+=Number(r.qty||0);
  if(d>m.lastIssue)m.lastIssue=d;
 });
 M.forEach(m=>{
  m.bal=m.in-m.out;m.avg=m.in?m.vin/m.in:0;m.value=m.bal*m.avg;
  let left=m.out;
  m.lots.sort((a,b)=>(a.exp||'9999-12-31').localeCompare(b.exp||'9999-12-31'));
  m.lots.forEach(l=>{const u=Math.min(l.qty,Math.max(0,left));l.rem=l.qty-u;left-=u});
 });
 return M;
}

/* 3) منصرف: الاسم - الرصيد - مستهلك - متبقي - الصلاحية */
function issueRows(){
 const sup=state.supplies.map(r=>({d:String(r.date||''),k:sp(r.item),q:Number(r.qty||0)}));
 const iss=state.issues.map((r,i)=>({r,i,d:String(r.date||''),k:sp(r.item),q:Number(r.qty||0)})).sort((a,b)=>a.d.localeCompare(b.d)||a.i-b.i);
 const used={};
 return iss.map(x=>{
  const prev=used[x.k]||0;
  let inn=sup.filter(s=>s.k===x.k&&s.d<=x.d).reduce((a,s)=>a+s.q,0);
  if(inn<prev+x.q)inn=sup.filter(s=>s.k===x.k).reduce((a,s)=>a+s.q,0);
  const bal=inn-prev;used[x.k]=prev+x.q;
  return {r:x.r,bal,use:x.q,left:bal-x.q};
 });
}

function cfPick(code){const c=state.clients.find(x=>x.code===code);if(!c)return;ui.pfc=c.code;ui.pf=c.name;$('cfList').innerHTML='';fillProfile()}
function cfSearch(q){
 q=String(q||'').trim().toLowerCase();ui.pfc='';ui.pf='';
 if(!q){$('cfList').innerHTML='';$('pfOut').innerHTML='';return}
 const norm=/^\d+$/.test(q)?'lc-'+q.padStart(3,'0'):q;
 let hits=state.clients.filter(c=>String(c.code).toLowerCase()===norm);
 if(!hits.length)hits=state.clients.filter(c=>[c.code,c.name,c.phone,c.phone2].join(' ').toLowerCase().includes(q));
 if(hits.length===1){$('cfList').innerHTML='';cfPick(hits[0].code);return}
 $('pfOut').innerHTML=hits.length?'':'<div class="panel empty">لا توجد نتائج</div>';
 $('cfList').innerHTML=hits.length?`<div class="table-wrap" style="margin-bottom:16px">${table(['رقم العميل','الاسم','الموبايل','إجراء'],hits.slice(0,15).map(c=>[esc(c.code),esc(c.name),esc(c.phone),`<button class="btn primary" style="padding:5px 9px" onclick="cfPick('${esc(c.code)}')">فتح</button>`]))}</div>`:'';
}

/* دورة رأس المال والأرباح: إيرادات شهرية - (أجور العاملين + المصروفات بكل أنواعها) */
function vCap(){
 if(!ui.cy)ui.cy=new Date().getFullYear();
 if(ui.cm===undefined)ui.cm='';
 $('acctBody').innerHTML=`<div class="panel" style="margin-bottom:13px"><div class="form-grid">
  <div class="field"><label>الشهر</label><select onchange="ui.cm=this.value;fillCap()"><option value="">كل الشهور</option>${MONTHS.map((m,i)=>`<option value="${i+1}" ${String(ui.cm)===String(i+1)?'selected':''}>${m}</option>`).join('')}</select></div>
  <div class="field"><label>العام</label><select onchange="ui.cy=Number(this.value);fillCap()">${years().map(y=>`<option value="${y}" ${ui.cy===y?'selected':''}>${y}</option>`).join('')}</select></div>
 </div></div><div class="table-wrap" id="capOut"></div>`;
 fillCap();
}
function fillCap(){
 const y=ui.cy,cm=ui.cm,T={rev:0,wages:0,cons:0,ops:0,gov:0,oth:0};
 const tag=n=>`<span class="tag ${n>=0?'green':'red'}">${money(n)}</span>`;
 const monthsToShow=cm?[Number(cm)]:MONTHS.map((_,i)=>i+1);
 const rows=monthsToShow.map(mi=>{
  const d=monthData(y,mi);Object.keys(T).forEach(k=>T[k]+=d[k]);
  return [MONTHS[mi-1],money(d.rev),money(d.wages),money(d.cons),money(d.ops),money(d.gov),money(d.oth),tag(d.rev-(d.wages+d.cons+d.ops+d.gov+d.oth))];
 });
 rows.push([`<b>إجمالي ${cm?MONTHS[Number(cm)-1]+' '+y:y}</b>`,`<b>${money(T.rev)}</b>`,`<b>${money(T.wages)}</b>`,`<b>${money(T.cons)}</b>`,`<b>${money(T.ops)}</b>`,`<b>${money(T.gov)}</b>`,`<b>${money(T.oth)}</b>`,tag(T.rev-(T.wages+T.cons+T.ops+T.gov+T.oth))]);
 $('capOut').innerHTML=table(['الشهر','الإيرادات الشهرية','أجور العاملين',KIND_CONS,KIND_OPS,KIND_GOV,KIND_OTH,'صافي الأرباح'],rows);
}

/* ============ التشغيل ============ */
fillLoginNames();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
/* بحث عام: يُضاف تلقائياً فوق أي جدول في أي أيقونة ليس له بحث (بالكود / الاسم / الموبايل) */
(function(){
 const view=$('view');if(!view)return;
 const norm=t=>String(t||'').toLowerCase().replace(/\s+/g,' ').trim();
 function match(tr,q){
  const t=norm(tr.textContent);
  if(t.includes(q))return true;
  const n=/^\d+$/.test(q)?'lc-'+q.padStart(3,'0'):q;
  return state.clients.some(c=>{const hit=[c.code,c.phone,c.phone2].some(v=>norm(v)===n||norm(v).includes(q));return hit&&c.name&&t.includes(norm(c.name))});
 }
 function enhance(){
  if(view.querySelector('.search:not(.gsearch),#pfQ,#cfQ'))return;
  view.querySelectorAll('.table-wrap').forEach(w=>{
   if(w.dataset.sx||w.closest('#pfOut,#cfList,#mMedOut,#cliHits,#invForm'))return;
   w.dataset.sx='1';
   const box=document.createElement('div');box.className='toolbar';
   box.innerHTML='<input class="gsearch search" placeholder="🔍 بحث بالكود / الاسم / الموبايل..." autocomplete="off">';
   w.parentNode.insertBefore(box,w);
   const hits=document.createElement('div');hits.className='gHits';w.parentNode.insertBefore(hits,w);
   box.firstChild.addEventListener('input',e=>{
    const q=norm(e.target.value);
    const nq=/^\d+$/.test(q)?'lc-'+q.padStart(3,'0'):q;
    const hl=q?state.clients.filter(c=>c.name&&([c.code,c.name,c.phone,c.phone2].some(v=>norm(v).includes(q))||norm(c.code)===nq)).slice(0,8):[];
    const kind={followup:'followup',feedback:'feedback',fuSessions:'sessLog',fuHistory:'medHistory'}[cur];
    const kl={followup:'+ متابعة',feedback:'+ تقييم',sessLog:'+ جلسة',medHistory:'+ تاريخ مرضي'}[kind];
    hits.innerHTML=hl.length?`<h3 style="margin:6px 0 10px">نتائج في قاعدة بيانات العملاء (${hl.length})</h3><div class="table-wrap" style="margin-bottom:16px">${table(['كود العميلة','الاسم','رقم الموبايل','تاريخ أول جلسة','ملاحظات','إجراء'],hl.map(c=>[esc(c.code),esc(c.name),esc(c.phone),esc(c.firstDate),esc(c.notes),`<button class="btn primary" style="padding:5px 9px" onclick="ui.pfc='${esc(c.code)}';ui.pf='${esc(c.name).replace(/'/g,'')}';vCFollow()">👤 فتح الملف</button>`+(kind?` <button class="btn" style="padding:5px 9px" onclick="addFor('${kind}','${c._id}')">${kl}</button>`:'')]))}</div>`:'';
    w.querySelectorAll('tbody tr').forEach(tr=>{if(tr.querySelector('td.empty'))return;tr.style.display=(!q||match(tr,q))?'':'none'});
   });
  });
 }
 let tm=null;
 new MutationObserver(()=>{clearTimeout(tm);tm=setTimeout(enhance,30)}).observe(view,{childList:true,subtree:true});
 enhance();
})();
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ★★★ الصق هنا إعدادات مشروع Firebase (Project settings ← Your apps ← Web app ← Config) ★★★ */
const FB_CONFIG={
  apiKey:"AIzaSyCUoTsC748tayYsL_FtR5T3A-GPWBVa8T4",
  authDomain:"lasercare123-222b6.firebaseapp.com",
  projectId:"lasercare123-222b6",
  storageBucket:"lasercare123-222b6.firebasestorage.app",
  messagingSenderId:"323361694297",
  appId:"1:323361694297:web:922b034de207294bf84748"
};

(function(){
'use strict';
const COLS=Object.keys(schemas);
const ON=typeof firebase!=='undefined'&&FB_CONFIG.apiKey&&!/^PASTE/.test(FB_CONFIG.apiKey);

/* مؤشر حالة المزامنة (صغير أسفل يمين الشاشة) */
const dot=document.createElement('div');
dot.style.cssText='position:fixed;right:10px;bottom:10px;z-index:39;font:700 11px Cairo,Tajawal,sans-serif;padding:4px 9px;border-radius:12px;background:#fff;border:1px solid #bbb;color:#555;opacity:.85;pointer-events:none';
document.body.appendChild(dot);
function setSt(s,m){
  const c={ok:['#1b7f4b','☁️ متزامن'],off:['#777','💾 محلي فقط'],wait:['#b7791f','☁️ جاري المزامنة…'],err:['#c65d68','⚠️ خطأ في المزامنة']}[s];
  dot.style.color=c[0];dot.style.borderColor=c[0];dot.textContent=c[1]+(m?' ('+m+')':'');
}
if(!ON){setSt('off');window.FBF=null;window.cloudPush=null;return}

setSt('wait');
firebase.initializeApp(FB_CONFIG);
const auth=firebase.auth(),db=firebase.firestore();
try{db.settings({ignoreUndefinedProperties:true})}catch(e){}
try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}

/* ---- أدوات ---- */
function canon(v){
  if(Array.isArray(v))return '['+v.map(canon).join(',')+']';
  if(v&&typeof v==='object')return '{'+Object.keys(v).filter(x=>v[x]!==undefined).sort().map(x=>JSON.stringify(x)+':'+canon(v[x])).join(',')+'}';
  return JSON.stringify(v===undefined?null:v);
}
function hs(s){let x=5381;for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return (x>>>0).toString(36)+'.'+s.length.toString(36)}
const hr=r=>hs(canon(r));
const clean=r=>JSON.parse(JSON.stringify(r));
function lsWrite(k){try{localStorage.setItem(KEY+k,JSON.stringify(state[k]))}catch(e){}_sc=null}
function inPlace(r,c){Object.keys(r).forEach(x=>{if(!(x in c))delete r[x]});Object.assign(r,c)}

/* آخر نسخة متزامنة لكل سجل (id → بصمة) — تُحفظ محلياً لاكتشاف التعديل/الحذف أثناء انقطاع النت */
const SM={},READY={};
COLS.forEach(k=>{try{SM[k]=JSON.parse(localStorage.getItem('lck_sm_'+k)||'{}')}catch(e){SM[k]={}}});
function saveSM(k){try{localStorage.setItem('lck_sm_'+k,JSON.stringify(SM[k]))}catch(e){}}

let errCount=0;
function commit(k,ops){
  if(!ops.length)return;
  const col=db.collection('lck_'+k);
  for(let i=0;i<ops.length;i+=400){
    const part=ops.slice(i,i+400),b=db.batch();
    part.forEach(o=>{if(o.t==='s')b.set(col.doc(o.id),clean(o.r));else b.delete(col.doc(o.id))});
    b.commit().then(()=>{
      part.forEach(o=>{if(o.t==='s')SM[k][o.id]=o.h;else delete SM[k][o.id]});
      saveSM(k);if(!errCount)setSt('ok');
    }).catch(e=>{
      console.error('cloud write',k,e);errCount++;setSt('err',e&&e.code||'');
      part.forEach(o=>{if(o.t==='d')SM[k][o.id]='?'});saveSM(k);
    });
  }
}
function doPush(k){
  const sm=SM[k],ops=[],seen=new Set();let fixed=false;
  state[k].forEach(r=>{
    if(!r._id){r._id=uid();fixed=true}
    seen.add(r._id);const h=hr(r);
    if(sm[r._id]!==h)ops.push({t:'s',id:r._id,r,h});
  });
  Object.keys(sm).forEach(id=>{if(!seen.has(id))ops.push({t:'d',id})});
  if(fixed)lsWrite(k);
  commit(k,ops);
}
const timers={};
window.cloudPush=function(k){
  if(!READY[k])return;               /* قبل أول مزامنة: reconcile هيلحق أي تعديل */
  clearTimeout(timers[k]);timers[k]=setTimeout(()=>doPush(k),300);
};

/* تحديث الشاشة بعد وصول تغييرات من جهاز آخر (من غير ما نقاطع مستخدم بيكتب) */
let rt=null;
function uiRefresh(){
  clearTimeout(rt);
  rt=setTimeout(()=>{
    try{
      if(me){
        const m=$('modal'),ae=document.activeElement;
        const typing=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
        if((m&&m.classList.contains('show'))||typing){rt=setTimeout(uiRefresh,4000);return}
        if(cur)refresh();
      }else fillLoginNames();
    }catch(e){console.warn(e)}
  },400);
}

/* أول مزامنة لكل جدول: 3-way بين النسخة المحلية والسحابة وآخر نسخة متزامنة */
function reconcile(k,snap){
  const cloud={};snap.forEach(d=>{const c=d.data();c._id=d.id;cloud[d.id]=c});
  const sm=SM[k],localIds=new Set(),next=[],ops=[];let changed=false;
  state[k].forEach(r=>{
    const id=r._id;
    if(!id){next.push(r);return}
    localIds.add(id);
    if(id in cloud){
      const hl=hr(r);
      if(sm[id]!==undefined&&sm[id]!==hl){next.push(r);ops.push({t:'s',id,r,h:hl})}       /* تعديل محلي لم يُرفع */
      else{const c=cloud[id];if(hr(c)!==hl){inPlace(r,c);changed=true}sm[id]=hr(r);next.push(r)}  /* السحابة هي المرجع */
    }else{
      if(sm[id]!==undefined){delete sm[id];changed=true}                                    /* اتحذف من جهاز آخر */
      else if(k==='users'&&nd(r.code)&&Object.values(cloud).some(c=>nd(c.code)===nd(r.code))){changed=true} /* مستخدم افتراضي مكرر */
      else{next.push(r);ops.push({t:'s',id,r,h:hr(r)})}                                     /* جديد لم يُرفع */
    }
  });
  Object.keys(cloud).forEach(id=>{
    if(localIds.has(id))return;
    if(sm[id]!==undefined)ops.push({t:'d',id});                                              /* اتحذف محلياً أثناء الأوفلاين */
    else{const c=cloud[id];next.push(c);sm[id]=hr(c);changed=true}                           /* جديد من جهاز آخر */
  });
  state[k]=next;saveSM(k);
  if(changed)lsWrite(k);
  commit(k,ops);
  READY[k]=true;
  if(changed)uiRefresh();
  if(COLS.every(x=>READY[x])&&!errCount)setSt('ok');
}
function applyChanges(k,snap){
  let changed=false;
  snap.docChanges().forEach(ch=>{
    if(ch.doc.metadata.hasPendingWrites)return;                                              /* صدى كتابتنا نحن */
    const id=ch.doc.id;
    if(ch.type==='removed'){
      const i=state[k].findIndex(r=>r._id===id);
      if(i>-1){state[k].splice(i,1);changed=true}
      delete SM[k][id];
    }else{
      const c=ch.doc.data();c._id=id;
      const r=state[k].find(x=>x._id===id);
      if(r){if(hr(r)!==hr(c)){inPlace(r,c);changed=true}}
      else{state[k].push(c);changed=true}
      SM[k][id]=hr(c);
    }
  });
  if(changed){saveSM(k);lsWrite(k);uiRefresh()}
}
function listen(k){
  db.collection('lck_'+k).onSnapshot(snap=>{
    if(!READY[k]){if(snap.metadata.fromCache)return;reconcile(k,snap);return}   /* ننتظر رد السيرفر الفعلي قبل أي مقارنة */
    applyChanges(k,snap);
  },e=>{console.error('cloud read',k,e);errCount++;setSt('err',e&&e.code||'')});
}

/* عدّاد كود العميلة */
const CC={sent:0,ready:false};
function pushCcn(){
  if(!CC.ready)return;
  const n=parseInt(localStorage.getItem(KEY+'ccn'))||0;
  if(n>CC.sent){CC.sent=n;db.collection('lck_meta').doc('ccn').set({n},{merge:true}).catch(()=>{CC.sent=0})}
}
function listenCcn(){
  db.collection('lck_meta').doc('ccn').onSnapshot(s=>{
    if(s.exists){const n=(s.data()||{}).n||0,cur=parseInt(localStorage.getItem(KEY+'ccn'))||0;if(n>cur)try{localStorage.setItem(KEY+'ccn',n)}catch(e){};CC.sent=Math.max(CC.sent,n)}
    CC.ready=true;pushCcn();
  },()=>{});
}

/* ملفات «معلومة طبية تفيدك»: تُقسَّم لقطع base64 داخل Firestore (بدون Storage) — حد 8 ميجا للملف */
const FC=700000,MAXF=8*1024*1024;
const b2s=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
function s2b(s,type){const bin=atob(s),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:type||'application/octet-stream'})}
const files=db.collection('lck_files');
window.FBF={
  ccn:pushCcn,
  async put(id,b){
    if(b.size>MAXF){alert('حجم الملف أكبر من 8 ميجا — اتحفظ على هذا الجهاز فقط ولن يظهر على باقي الأجهزة');return}
    try{
      const s=await b2s(b),n=Math.max(1,Math.ceil(s.length/FC));
      let old=0;try{const o=await files.doc(id).get();if(o.exists)old=o.data().n||0}catch(e){}
      await Promise.all(Array.from({length:n},(_,i)=>files.doc(id+'_'+i).set({d:s.slice(i*FC,(i+1)*FC)})));
      await files.doc(id).set({name:b.name||'',type:b.type||'',size:b.size,n,ts:Date.now()});
      for(let i=n;i<old;i++)files.doc(id+'_'+i).delete().catch(()=>{});
    }catch(e){console.error('cloud file put',e);setSt('err','file')}
  },
  async get(id,cacheFn){
    try{
      const m=await files.doc(id).get();if(!m.exists)return undefined;
      const d=m.data(),parts=await Promise.all(Array.from({length:d.n},(_,i)=>files.doc(id+'_'+i).get()));
      if(parts.some(p=>!p.exists))return undefined;
      const blob=s2b(parts.map(p=>p.data().d).join(''),d.type);
      try{cacheFn&&await cacheFn(id,blob)}catch(e){}
      return blob;
    }catch(e){console.error('cloud file get',e);return undefined}
  },
  async del(id){
    try{
      const m=await files.doc(id).get();if(!m.exists)return;
      const n=m.data().n||0;
      await Promise.all([files.doc(id).delete(),...Array.from({length:n},(_,i)=>files.doc(id+'_'+i).delete())]);
    }catch(e){console.error('cloud file del',e)}
  }
};

/* التشغيل: دخول مجهول ثم الاشتراك في الجداول */
let started=false;
function start(){if(started)return;started=true;listenCcn();COLS.forEach(listen)}
auth.onAuthStateChanged(u=>{if(u)start()});
auth.signInAnonymously().catch(e=>{console.warn('anonymous auth',e&&e.code);start()});
window.addEventListener('online',()=>{COLS.forEach(k=>{if(READY[k])doPush(k)});pushCcn()});
window.addEventListener('offline',()=>setSt('off','بدون إنترنت'));
})();
</script>
